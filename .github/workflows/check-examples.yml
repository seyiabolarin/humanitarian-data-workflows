name: Check public examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_notebooks.py
      - run: python -m unittest discover -s tests -v
  r-syntax-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'for (f in list.files("R", full.names=TRUE)) invisible(parse(f))'
      - run: Rscript tests/test_export.R
